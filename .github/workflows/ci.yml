name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install export toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-fonts-recommended
          command -v pandoc
          command -v xelatex

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app scripts tests

      - name: Run stable-core tests
        env:
          BOOK_SYSTEM_ENV: test
        run: python -m pytest -q
