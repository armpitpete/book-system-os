# Review certificate paths before enabling this example.
<VirtualHost *:80>
    ServerName publish.toiletrage.co.uk
    Redirect permanent / https://publish.toiletrage.co.uk/
</VirtualHost>

<VirtualHost *:443>
    ServerName publish.toiletrage.co.uk

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/publish.toiletrage.co.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/publish.toiletrage.co.uk/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8080/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/publish.toiletrage.co.uk-error.log
    CustomLog ${APACHE_LOG_DIR}/publish.toiletrage.co.uk-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "DENY"
</VirtualHost>
