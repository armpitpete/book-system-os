name: Apply publishing metadata candidate

on:
  push:
    branches:
      - agent/publishing-metadata-binding
    paths:
      - .github/workflows/apply-publishing-metadata.yml

permissions:
  contents: write

jobs:
  apply-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out helper commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Verify base and apply exact tested patch
        shell: bash
        env:
          EXPECTED_BASE: b9cdb97707877d2a4ea6902bf1caf338c30fadfd
          EXPECTED_PATCH_SHA256: 3b371d6383ad0d8d27b6391f55278293571e5b23f94a53167c3976c59b7fc906
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          base64 -d .project/publishing-metadata.patch.gz.b64 | gunzip > /tmp/publishing-metadata.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/publishing-metadata.patch" | sha256sum -c -
          git apply --check /tmp/publishing-metadata.patch
          git apply /tmp/publishing-metadata.patch
          git rm .github/workflows/apply-publishing-metadata.yml .project/publishing-metadata.patch.gz.b64
          git config user.name "Merrin W. Dream"
          git config user.email "merrin@merrinworld.uk"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -v '^.github/workflows/apply-publishing-metadata.yml$' | grep -v '^.project/publishing-metadata.patch.gz.b64$' | wc -l)" -eq 20
          git commit -m "Bind publishing title and language to exact artifacts"
          git push origin HEAD:agent/publishing-metadata-binding
