name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install exact export toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates texlive-xetex texlive-latex-recommended texlive-fonts-recommended
          bash scripts/install_pinned_pandoc.sh --runtime-root "$RUNNER_TEMP/book-system-pandoc"
          echo "$RUNNER_TEMP/book-system-pandoc/current/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/book-system-pandoc/current/bin:$PATH"
          command -v pandoc
          command -v xelatex
          python scripts/check_runtime_compatibility.py --pandoc-only

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app scripts tests

      - name: Run stable-core tests
        env:
          BOOK_SYSTEM_ENV: test
          H08_ARTIFACT_DIR: artifacts/h08-representative
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q 2>&1 | tee artifacts/pytest.log

      - name: Upload H-08 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h08-regression-evidence
          path: artifacts
          if-no-files-found: error
          retention-days: 14
